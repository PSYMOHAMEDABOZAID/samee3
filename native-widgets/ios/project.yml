name: Samee3
options:
  bundleIdPrefix: com.samee3
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Samee3App:
    type: application
    platform: iOS
    sources:
      - path: Samee3App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samee3.app
        INFOPLIST_FILE: Samee3App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Samee3App/Samee3App.entitlements
    dependencies:
      - target: Samee3Widgets
        embed: true
  Samee3Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Samee3Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samee3.app.widgets
        CODE_SIGN_ENTITLEMENTS: Samee3Widgets/Samee3Widgets.entitlements
        INFOPLIST_FILE: Samee3Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
