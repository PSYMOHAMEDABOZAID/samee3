name: SAMEE3 - Alafasy Verified Riwayat Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,15 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/install-alafasy-five.py'
      - 'scripts/sync-alafasy-riwayat.py'
      - 'lib/alafasy-five-mushafs.ts'
      - 'lib/quran/alafasy-collected.ts'
      - 'lib/alafasy-riwayat-manifest.json'
      - '.github/workflows/add-alafasy-five.yml'

permissions:
  contents: write

concurrency:
  group: samee3-verified-alafasy-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scanner dependencies
        run: python -m pip install 'requests>=2.32,<3'
      - name: Install editions non-destructively
        run: python scripts/install-alafasy-five.py
      - name: Detect new verified complete editions
        run: python scripts/sync-alafasy-riwayat.py
      - name: Check essential files
        run: python scripts/check-alafasy-files.py
      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- app/audio/page.tsx lib/alafasy-riwayat-manifest.json)" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install JS dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm ci
      - name: Validate production build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build
      - name: Publish only after successful build
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/audio/page.tsx lib/alafasy-riwayat-manifest.json
          git commit -m 'feat(audio): sync verified Alafasy riwayat editions'
          git push origin HEAD:main
