
name: Repair SAMEE3 audio library memory issues

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply guarded audio fixes
        run: node scripts/fix-audio-memory.cjs

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and build
        run: npm run build

      - name: Commit only validated audio changes
        run: |
          if git diff --quiet -- app/audio/page.tsx public/sw.js; then
            echo "No audio changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/audio/page.tsx public/sw.js

          git commit -m "fix(audio): reduce memory pressure and stream cached recordings"

          git push origin HEAD:main
