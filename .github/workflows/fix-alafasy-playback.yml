        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/alafasy-riwayat/route.ts app/audio/alafasy-riwayat/AlafasyRiwayatContent.tsx app/audio/alafasy-riwayat/page.tsx app/audio/page.tsx scripts/install-alafasy-audio-tab.cjs
          if git diff --cached --quiet; then
            echo "Audio player fix already installed."
          else
            git commit -m "Fix Alafasy audio player and integrate riwayat tab"
            git push origin HEAD:main
          fi
